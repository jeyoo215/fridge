spring.application.name=backend

# --- DB 연결 정보 (로컬 개발용 기본값. 팀 공용 DB 붙일 때 여기만 바꾸면 됨) ---
spring.datasource.url=jdbc:mysql://localhost:3306/fridge?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useUnicode=true
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA 설정 ---
# ddl-auto=none : 이제 스키마는 schema.sql이 관리하므로 Hibernate는 테이블을 건드리지 않음
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- 개발용 샘플 데이터 자동 삽입 (data.sql) ---
# defer-datasource-initialization=true : Hibernate가 테이블부터 만든 후에 data.sql이 실행되도록 순서 보장
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8