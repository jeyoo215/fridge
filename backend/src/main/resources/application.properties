spring.application.name=backend

spring.config.import=optional:application-secret.properties

#logging.level.org.springframework.security=DEBUG
#logging.level.org.springframework.security.oauth2=TRACE

# JWT
jwt.secret=fridge-app-jwt-secret-key-for-dev-environment-please-keep-32-bytes-or-more
jwt.access-token-expiration-ms=1800000
jwt.refresh-token-expiration-ms=1209600000

# 카카오 소셜 로그인
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.kakao.scope=profile_nickname
spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id
app.oauth2.redirect-uri=http://localhost:5173/oauth/redirect

# --- DB 연결 정보 ---
spring.datasource.url=jdbc:mysql://localhost:3306/fridge?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useUnicode=true
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA 설정 ---
# ddl-auto=update : Entity 클래스 기준으로 테이블을 자동 생성/수정 (개발 단계에서만 사용, 운영에서는 위험함)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- 개발용 샘플 데이터 자동 삽입 (data.sql) ---
# defer-datasource-initialization=true : Hibernate가 테이블부터 만든 후에 data.sql이 실행되도록 순서 보장
spring.jpa.defer-datasource-initialization=true
# mode=always였을 때는 재시작할 때마다 테이블을 지우고 샘플 데이터로 리셋해버려서,
# 직접 등록/수정한 재료가 다 날아가는 문제가 있었음.
# 이제부턴 자동 실행 안 함(never). DB를 새로 만들었을 때 딱 한 번만, MySQL Workbench 등에서
# data.sql 내용을 직접 실행해서 재료 마스터를 채워주면 됨.
spring.sql.init.mode=never
spring.sql.init.encoding=UTF-8

# --- 비밀번호 재설정 이메일 발송 (Gmail SMTP) ---
# 계정/앱 비밀번호(spring.mail.username, spring.mail.password)는 application-secret.properties에서 채움.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# --- Google Vision 이미지 인식 ---
google.vision.credentials.location=classpath:google-vision-key.json

# --- 이미지 업로드 용량 제한 (카메라 재료 인식용, 폰 카메라 사진 대비 넉넉하게) ---
# 커뮤니티 게시글 첨부(이미지 50MB, 동영상 100MB)도 같이 쓰므로 가장 큰 값(100MB) 기준으로 맞춤.
# 실제 파일 크기 상한은 CommunityMediaService에서 미디어 타입별로 다시 한번 검증함.
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# --- 커뮤니티 게시글 첨부파일 로컬 저장 경로 (개발용, 로컬 디스크) ---
community.media.upload-dir=uploads/community










# ===============================
# PYTHON
# ===============================
# --- 의외의 재료 조합 추천 배치(ml/calculate_combo_recommendation.py) 스케줄러 설정 (FR-23) ---
# 로컬에 파이썬/venv 환경이 없으면 false로 꺼두면 됨 (백엔드만 띄우고 싶을 때)
combo.batch.enabled=true
# 가상환경 파이썬 실행 파일 경로. 팀원마다 venv 위치가 다르므로 각자 로컬에서 값을 바꿔써야 함.
# 예: ml/venv/Scripts/python.exe (Windows) 또는 ml/venv/bin/python (macOS/Linux)
combo.batch.python-path=ml/venv/Scripts/python.exe
# calculate_combo_recommendation.py 경로
combo.batch.script-path=./ml/calculate_combo_recommendation.py
# 매일 새벽 3시 실행 (초 분 시 일 월 요일)
combo.batch.cron=0 0 3 * * *