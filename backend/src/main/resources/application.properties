spring.application.name=backend

# --- DB 연결 정보 (로컬 개발용 기본값. 팀 공용 DB 붙일 때 여기만 바꾸면 됨) ---
spring.datasource.url=jdbc:mysql://localhost:3306/fridge?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useUnicode=true
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA 설정 ---
# ddl-auto=update : Entity 클래스 기준으로 테이블을 자동 생성/수정 (개발 단계에서만 사용, 운영에서는 위험함)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- 개발용 샘플 데이터 자동 삽입 (data.sql) ---
# defer-datasource-initialization=true : Hibernate가 테이블부터 만든 후에 data.sql이 실행되도록 순서 보장
spring.jpa.defer-datasource-initialization=true
# mode=always였을 때는 재시작할 때마다 테이블을 지우고 샘플 데이터로 리셋해버려서,
# 직접 등록/수정한 재료가 다 날아가는 문제가 있었음.
# 이제부턴 자동 실행 안 함(never). DB를 새로 만들었을 때 딱 한 번만, MySQL Workbench 등에서
# data.sql 내용을 직접 실행해서 재료 마스터를 채워주면 됨.
spring.sql.init.mode=never
spring.sql.init.encoding=UTF-8

# --- Google Vision 이미지 인식 ---
google.vision.credentials.location=classpath:google-vision-key.json

# --- 이미지 업로드 용량 제한 (카메라 재료 인식용, 폰 카메라 사진 대비 넉넉하게) ---
# 커뮤니티 게시글 첨부(이미지 50MB, 동영상 100MB)도 같이 쓰므로 가장 큰 값(100MB) 기준으로 맞춤.
# 실제 파일 크기 상한은 CommunityMediaService에서 미디어 타입별로 다시 한번 검증함.
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# 식약처 조리식품 레시피 API
foodsafety.api.key=${FOODSAFETY_API_KEY:}
foodsafety.api.base-url=http://openapi.foodsafetykorea.go.kr/api

# Claude API (재료 파싱용)
anthropic.api.key=${ANTHROPIC_API_KEY:}
anthropic.api.url=https://api.anthropic.com/v1/messages

# --- 커뮤니티 게시글 첨부파일 로컬 저장 경로 (개발용, 로컬 디스크) ---
community.media.upload-dir=uploads/community








