spring.application.name=backend

# --- DB 연결 정보 (로컬 개발용 기본값. 팀 공용 DB 붙일 때 여기만 바꾸면 됨) ---
spring.datasource.url=jdbc:mysql://localhost:3306/fridge?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useUnicode=true
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA 설정 ---
# ddl-auto=update : Entity 클래스 기준으로 테이블을 자동 생성/수정 (개발 단계에서만 사용, 운영에서는 위험함)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- 개발용 샘플 데이터 자동 삽입 (data.sql) ---
# defer-datasource-initialization=true : Hibernate가 테이블부터 만든 후에 data.sql이 실행되도록 순서 보장
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# --- Google Vision 이미지 인식 ---
google.vision.credentials.location=classpath:google-vision-key.json
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
