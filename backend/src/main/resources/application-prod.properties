# 배포 환경 전용 오버라이드. application.properties의 로컬 기본값 위에 이 값들만 덮어씀.
# 활성화: java -jar app.jar --spring.profiles.active=prod
# 또는 환경변수: SPRING_PROFILES_ACTIVE=prod

# 카카오 로그인 성공 후 돌려보낼 프론트 주소 (로컬은 application.properties의 localhost:5173 유지)
app.oauth2.redirect-uri=https://43.202.140.77:8080/oauth/redirect

# CORS 허용 origin (WebConfig가 이 값을 읽도록 아래 3번에서 수정)
app.cors.allowed-origins=https://43.202.140.77:8080